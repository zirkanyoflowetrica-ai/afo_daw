<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio modular</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1c9;--pn2:#ffe48a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:#000;font:500 14px/1.4 "Space Grotesk",system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,select,textarea,input{font:inherit;color:#000}
button{background:#fff;border:2px solid #000;border-radius:0;padding:5px 10px;cursor:pointer;font-weight:600;box-shadow:3px 3px 0 #000;transition:transform .08s,box-shadow .08s}
button:hover{background:var(--pn2)}button:active{transform:translate(3px,3px);box-shadow:none}
:focus-visible{outline:3px solid #2a6bff;outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid #000;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px}
.transport,.zoom{display:flex;gap:6px;align-items:center}
.play{background:#ffc233;min-width:100px}
.time,.lcd{background:#120f0a;color:#ffb000;border:3px solid #000;padding:2px 10px;font-weight:700;font-size:18px;letter-spacing:.08em;text-shadow:0 0 7px #ffb00099;text-align:center;box-shadow:inset 0 0 0 2px #3a3020;display:inline-block}
header input{width:64px;background:#fff;border:2px solid #000;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-items:center}
.chips::before{content:"Módulos:";font-weight:700}
.chip{display:flex;gap:7px;align-items:center}
.chip i{width:12px;height:12px;border:2px solid #000;background:#fff}
.chip[aria-pressed=true]{background:var(--c)}.chip[aria-pressed=true] i{background:#000}
.chip[aria-pressed=false]::after{content:"+";font-weight:700}
main{position:fixed;left:0;right:0;bottom:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(#000 1.6px,transparent 1.9px);background-size:34px 34px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#cables{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#nodes{position:absolute;left:0;top:0}
.cb{stroke:#000;stroke-width:12;fill:none;stroke-linecap:round;filter:drop-shadow(4px 4px 0 #000)}
.cc{stroke-width:6;fill:none;stroke-linecap:round}
.cf{stroke:#fff;stroke-width:2.5;fill:none;stroke-dasharray:3 16;stroke-linecap:round;opacity:0}
.on .cf{opacity:.95;animation:fl .6s linear infinite}@keyframes fl{to{stroke-dashoffset:-19}}
.panel{position:absolute;min-width:240px;min-height:190px;display:flex;flex-direction:column;border:3px solid #000;box-shadow:7px 7px 0 #000;background-color:var(--c);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,transparent 1px 4px),linear-gradient(180deg,rgba(255,255,255,.3),rgba(0,0,0,.1))}
.panel.hidden{display:none}
.panel::before,.panel::after{content:"";position:absolute;bottom:7px;width:14px;height:14px;border-radius:50%;border:2px solid #000;background:linear-gradient(35deg,transparent 43%,#000 43% 57%,transparent 57%),radial-gradient(circle at 35% 30%,#fff,#a8a8a8 55%,#555)}
.panel::before{left:8px}.panel::after{right:8px}
#p-inst,#p-drums,#p-piano{box-shadow:inset 16px 0 0 #8a5a2b,inset -16px 0 0 #8a5a2b,7px 7px 0 #000}
#p-inst .pb,#p-drums .pb,#p-piano .pb{padding-left:30px;padding-right:30px}
#p-piano{background-color:#1b1c22;background-image:repeating-linear-gradient(90deg,#ffffff0d 0 1px,transparent 1px 4px)}
#p-cinta{background-color:#c9ccd2}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#000;color:#fff;cursor:move;user-select:none;touch-action:none}
.ph::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c);border:2px solid #fff}
.ph h2{font-size:17px;margin:0;font-weight:700;flex:1;color:var(--c)}
.ph button{padding:2px 8px;font-size:12px}
.mdl{background:#e4e4e4;color:#000;border:2px solid #000;font-size:11px;font-weight:700;padding:0 6px}
.pb{padding:12px 12px 30px;flex:1;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain}
.port{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,var(--c) 0 36%,#111 38% 60%,#d0d0d0 62%);border:3px solid #000;box-shadow:2px 2px 0 #000;z-index:8;pointer-events:auto;cursor:grab;touch-action:none}
.port:hover,.port.moving{outline:3px solid #fff;outline-offset:2px;transform:scale(1.13)}
.port[data-end="from"]{box-shadow:2px 2px 0 #000, inset 0 0 0 1px #fff}
.resize-handle{position:absolute;z-index:9;width:16px;height:16px;background:#fff;border:3px solid #000;box-shadow:2px 2px 0 #000;touch-action:none;opacity:.8}
.panel:hover .resize-handle,.resize-handle:hover{opacity:1;background:#ffc233}
.resize-handle[data-side="nw"]{left:-9px;top:-9px;cursor:nwse-resize}.resize-handle[data-side="n"]{left:calc(50% - 8px);top:-9px;cursor:ns-resize}.resize-handle[data-side="ne"]{right:-9px;top:-9px;cursor:nesw-resize}
.resize-handle[data-side="e"]{right:-9px;top:calc(50% - 8px);cursor:ew-resize}.resize-handle[data-side="se"]{right:-9px;bottom:-9px;cursor:nwse-resize}.resize-handle[data-side="s"]{left:calc(50% - 8px);bottom:-9px;cursor:ns-resize}.resize-handle[data-side="sw"]{left:-9px;bottom:-9px;cursor:nesw-resize}.resize-handle[data-side="w"]{left:-9px;top:calc(50% - 8px);cursor:ew-resize}
#handles{position:absolute;top:0;left:0;pointer-events:none}
.cable-bend{position:absolute;width:21px;height:21px;border:3px solid #000;background:#fff;box-shadow:2px 2px 0 #000;transform:translate(-50%,-50%);border-radius:4px;z-index:12;pointer-events:auto;cursor:move;touch-action:none;display:flex;align-items:center;justify-content:center}
.cable-bend::after{content:"";width:8px;height:8px;background:var(--c);border:1px solid #000}
.cable-bend:hover{background:#ffc233;outline:3px solid #fff;outline-offset:1px}
#help{line-height:1.5}
.hint,.empty{margin:8px 0 0;font-size:12px}
.empty{padding:14px;border:2px dashed #000;background:#ffffff66}
.tb,.tabs,.tbtn,.ybtn,.drb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{padding:2px 8px;font-size:12px}.tabs button[aria-pressed=true]{background:#000;color:#fff}
/* pistas */
.scroll{position:relative;overflow-x:auto;background:#16130e;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a4030}
.row{display:grid;grid-template-columns:170px minmax(560px,1fr);border-bottom:2px solid #000}
.th{background:#2b2720;color:#f3e7c4;padding:6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border-left:8px solid var(--c);border-right:2px solid #000}
.th.sel{background:#51452e}.th small{color:#bdb398}.th b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{display:flex;gap:4px}.ms button{padding:0 6px;font-size:12px;box-shadow:2px 2px 0 #000}.ms button[aria-pressed=true]{background:#ffc233}
.lane{position:relative;min-height:64px;background:repeating-linear-gradient(90deg,transparent 0 calc(6.25% - 1px),rgba(255,255,255,.14) calc(6.25% - 1px) 6.25%)}
.clip{position:absolute;top:5px;bottom:5px;background:var(--c);border:2px solid #000;box-shadow:2px 2px 0 #000}
.mn{position:absolute;width:.34%;height:3px;background:#000}
.mn.d0{background:#ff4d3d}.mn.d1{background:#ff9b3d}.mn.d5{background:#ffe14d}
.wf{position:absolute;top:50%;width:.26%;background:#000;transform:translateY(-50%)}
.muted .clip{opacity:.3}.off .lane{opacity:.3}
.ph-line{position:absolute;top:0;bottom:0;width:3px;background:#ffd34d;box-shadow:0 0 7px #ffd34d;z-index:2;pointer-events:none;transition:left .15s linear}
/* knobs, faders, meters */
.krow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.kn{display:flex;flex-direction:column;align-items:center;gap:4px}.kn small{font-size:11px;font-weight:600}
.knob{width:46px;height:46px;border-radius:50%;background:conic-gradient(#5a5a5a,#e6e6e6,#6a6a6a,#d4d4d4,#5a5a5a);border:3px solid #000;box-shadow:3px 3px 0 #000;position:relative;transform:rotate(var(--r,0deg));cursor:ns-resize;touch-action:none}
.knob::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#222;border:2px solid #000}
.knob::after{content:"";position:absolute;left:50%;top:2px;width:5px;height:13px;margin-left:-2.5px;background:#ff4d3d;border:1px solid #000;border-radius:2px}
.strips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.strip{background:#d9d2bd;border:2px solid #000;border-top:8px solid var(--c);box-shadow:3px 3px 0 #000;padding:8px;width:84px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.strip small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.fad{display:flex;gap:6px;height:150px}.big .fad{height:190px}
.fad input{writing-mode:vertical-lr;direction:rtl;-webkit-appearance:none;appearance:none;background:transparent;width:32px;cursor:grab}
.fad input::-webkit-slider-runnable-track{width:8px;background:#000}
.fad input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:18px;margin-left:-11px;background:#eee linear-gradient(#000,#000) center/100% 3px no-repeat;border:3px solid #000;box-shadow:3px 3px 0 #000}
.fad input::-moz-range-track{width:8px;background:#000}
.fad input::-moz-range-thumb{width:24px;height:12px;background:#eee linear-gradient(#000,#000) center/100% 3px no-repeat;border:3px solid #000;border-radius:0}
.meter{width:12px;background:#120f0a;border:2px solid #000;position:relative;overflow:hidden}.big .meter{width:16px}
.meter span{position:absolute;bottom:0;left:0;right:0;height:var(--h,0%);background:linear-gradient(0deg,#5ee0b0 70%,#ffc233 85%,#ff7a70)}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,#120f0a 5px 7px)}
.mrow{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:10px}
.vu{background:#f4e3a3;border:3px solid #000;box-shadow:inset 0 0 0 3px #d9c47a,5px 5px 0 #000;margin:0 0 16px;max-width:260px}.vu svg{display:block;width:100%}
/* piano */
.ytop{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(#ececf0,#b4b4be);border:3px solid #000;padding:8px;margin-bottom:10px;box-shadow:3px 3px 0 #000}
.ylcd{background:#0b2547;color:#9fd8ff;border:3px solid #000;padding:6px 10px;min-width:190px;display:flex;flex-direction:column;box-shadow:inset 0 0 0 2px #1d4a85;text-shadow:0 0 6px #4aa8ff88}
.ylcd b{font-size:17px}.ylcd small{font-size:11px;color:#6fb0e8}
.ybtn{max-width:300px;margin:0}.ybtn button{background:#d6d6dc;padding:4px 8px;font-size:12px}.ybtn button[aria-pressed=true]{background:#ffb000}
.roll{display:grid;grid-template-columns:44px repeat(16,1fr);min-width:480px;background:#16130e;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a4030}
.k{font-size:11px;color:#bdb398;padding:0 4px;display:flex;align-items:center;border-bottom:1px solid #ffffff1f}.k.blk{background:#0006}
.cell{box-shadow:none;border:0;border-radius:0;border-bottom:1px solid #ffffff1a;border-left:1px solid #ffffff1a;height:20px;padding:0;background:transparent}
.cell:nth-child(16n+2){border-left-color:#fff6}.cell:hover{background:#ffffff26}.cell:active{transform:none}
.cell.on{background:#b79bff;border:2px solid #000}
.kb{position:relative;display:flex;height:130px;margin-top:12px;border:3px solid #000;background:#000}
.wk{flex:1;min-width:0;border:1px solid #000;border-radius:0 0 4px 4px;background:linear-gradient(#fff,#e6e6e6);box-shadow:none;padding:0;display:flex;align-items:flex-end;justify-content:center;color:#555;font-size:10px}
.wk:hover{background:linear-gradient(#fff,#e6e6e6)}.wk:active,.wk.dn{background:#cfc7ff;transform:none}
.bk{position:absolute;top:0;width:4.4%;height:62%;background:#111;border:1px solid #000;border-radius:0 0 3px 3px;z-index:2;padding:0;box-shadow:none}
.bk:hover{background:#111}.bk:active,.bk.dn{background:#666;transform:none}
/* instrumentos y batería */
.vst{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.vst small{flex:1;min-width:150px;font-size:12px}
.insts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0}
.inst{text-align:left;display:flex;flex-direction:column;gap:2px;background:#2b2720;color:#f3e7c4;box-shadow:3px 3px 0 #000}
.inst small{color:#bdb398}.inst::before{content:"";width:11px;height:11px;border-radius:50%;background:#4a1d1a;border:2px solid #000;margin-bottom:4px}
.inst[aria-pressed=true]::before{background:#ff4d3d;box-shadow:0 0 9px #ff4d3d}
.drtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.seq{background:#16130e;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a4030;padding:8px;display:flex;flex-direction:column;gap:6px}
.sr{display:flex;gap:8px;align-items:center}
.dl{width:108px;flex:none;text-align:left;padding:3px 6px;font-size:12px;background:#2b2720;color:#f3e7c4}
.sc{flex:1;display:grid;grid-template-columns:repeat(16,1fr);gap:3px;min-width:0}
.st{height:26px;min-width:0;padding:0;box-shadow:none;background:#3a352b}.st:hover{background:#4d463a}.st:active{transform:none}
.st.on.g0{background:#ff4d3d}.st.on.g1{background:#ff9b3d}.st.on.g2{background:#ffe14d}.st.on.g3{background:#fff4d6}
.st.cur{outline:3px solid #fff;outline-offset:-4px}
/* cinta */
.reels{display:flex;gap:34px;justify-content:center;padding:14px;background:#16130e;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a4030;margin-bottom:10px}
.reel{width:92px;height:92px;border-radius:50%;border:4px solid #000;background:radial-gradient(circle,#000 0 12%,#d9d9d9 13% 22%,transparent 23%),conic-gradient(#222 0 12%,#e8e8e8 12% 33%,#222 33% 45%,#e8e8e8 45% 66%,#222 66% 78%,#e8e8e8 78% 100%)}
.go .reel{animation:sp 1.1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tvu{height:12px;background:#120f0a;border:2px solid #000;position:relative;margin:8px 0}.tvu span{position:absolute;inset:0 auto 0 0;width:var(--h,0%);background:linear-gradient(90deg,#5ee0b0 70%,#ffc233 85%,#ff4d3d)}
#rec{background:#ff4d3d;color:#fff}.go #rec{box-shadow:0 0 12px #ff4d3d,3px 3px 0 #000}
/* ia */
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
textarea,select{background:#fff;border:2px solid #000;border-radius:0;padding:7px;width:100%}
#b-ia textarea{background:#08170f;color:#7dffb0;border:3px solid #000;box-shadow:inset 0 0 14px #000;font-family:ui-monospace,Menlo,monospace;text-shadow:0 0 5px #3aff8a88}
.go2{background:#6ab8ff;padding:8px 12px;box-shadow:4px 4px 0 #000}
#help{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;background:#fff;border:2px solid #000;box-shadow:3px 3px 0 #000;padding:6px 10px;font-size:12px;font-weight:600;max-width:calc(100% - 28px);pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;padding:8px 14px;box-shadow:4px 4px 0 #ffc233;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:600;z-index:6;max-width:90%}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.on .cf,.go .reel{animation:none}}
</style>
</head>
<body>
<header>
  <div class="transport">
    <button id="stop" aria-label="Detener">■</button>
    <button id="play" class="play">▶ Reproducir</button>
    <span class="time" id="time">1.1</span>
    <label style="flex-direction:row;align-items:center;gap:6px">Tempo <input id="bpm" type="number" value="96" min="40" max="220"></label>
  </div>
  <div class="zoom"><button id="zo" aria-label="Alejar">−</button><button id="zi" aria-label="Acercar">+</button><button id="za">Ver todo</button><button id="resetLayout" title="Restaurar posiciones, tamaños y cables iniciales">Restaurar diseño</button></div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"><div id="world"><svg id="cables"></svg><div id="nodes"></div><div id="handles"></div></div></main>
<div id="help">Franja negra: mover módulo · Cuadritos del borde: cambiar ancho y alto · Conectores redondos: arrastra a cualquier lado · Cuadrado del cable: cambiar su curva.</div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PANELS=[['piano','Piano roll','Teclas S-61'],['inst','Instrumentos','Banco VST-1'],['drums','Batería','Ritmos R-16'],['cinta','Grabador de cintas','Cinta RX-2'],['ia','Pistas con IA','Cerebro AI-1'],['pistas','Pistas','Mesa MT-8'],['mezcla','Mezcla','Consola 6C'],['master','Mezcla final','Master VU']];
const PC={pistas:'#ffc233',piano:'#b79bff',mezcla:'#5ee0b0',inst:'#ff7a70',ia:'#6ab8ff',master:'#ff9ee0',drums:'#d4f26a',cinta:'#c9ccd2'};
const POS={piano:[0,0,780],ia:[0,800,380],inst:[1080,0,440],drums:[1080,560,780],cinta:[1080,1140,420],pistas:[2200,300,760],mezcla:[3260,100,560],master:[4120,260,380]};
const DEFAULT_POS=JSON.parse(JSON.stringify(POS));
const PORT_OVERRIDE={},BENDS={};
const LAYOUT_KEY='allforone-estudio-modular-layout-v2';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function loadLayout(){try{const saved=JSON.parse(localStorage.getItem(LAYOUT_KEY)||'null');if(!saved)return;
 for(const id of Object.keys(POS)){const q=saved.pos?.[id];if(Array.isArray(q)&&q.length>=3&&q.slice(0,3).every(Number.isFinite)){POS[id]=[clamp(q[0],-15000,15000),clamp(q[1],-15000,15000),clamp(q[2],240,5000)];if(Number.isFinite(q[3]))POS[id][3]=clamp(q[3],190,4000)}}
 for(const [k,v] of Object.entries(saved.ports||{}))if(v&&['top','bottom','left','right'].includes(v.side)&&Number.isFinite(v.u))PORT_OVERRIDE[k]={side:v.side,u:clamp(v.u,.03,.97)};
 for(const [k,v] of Object.entries(saved.bends||{}))if(v&&Number.isFinite(v.x)&&Number.isFinite(v.y))BENDS[k]={x:clamp(v.x,-15000,15000),y:clamp(v.y,-15000,15000)};
 }catch(e){console.warn('No se pudo restaurar el diseño',e)}}
function saveLayout(){try{localStorage.setItem(LAYOUT_KEY,JSON.stringify({pos:POS,ports:PORT_OVERRIDE,bends:BENDS}))}catch(e){console.warn('No se pudo guardar el diseño',e)}}
function resetLayout(){for(const id of Object.keys(DEFAULT_POS)){POS[id]=DEFAULT_POS[id].slice();const el=$('#p-'+id);if(el){const o=POS[id];el.style.left=o[0]+'px';el.style.top=o[1]+'px';el.style.width=o[2]+'px';el.style.height=''}}for(const k in PORT_OVERRIDE)delete PORT_OVERRIDE[k];for(const k in BENDS)delete BENDS[k];sync();fit(['inst','drums','pistas']);saveLayout();toast('Diseño original restaurado')}
const SRC={inst:'inst',drum:'drums',ia:'ia',voz:'cinta'},TN={inst:'Instrumento',drum:'Batería',ia:'IA',voz:'Voz'};
const INSTS=[['Piano de cola','Teclas'],['Bajo sintético','Graves'],['Batería acústica','Percusión'],['Guitarra eléctrica','Cuerdas'],['Pad ambiental','Sintetizador'],['Cuerdas de orquesta','Cuerdas'],['Voz coral','Voces'],['Campanas','Percusión']];
const WV=['triangle','sawtooth','square','sawtooth','sine','sawtooth','sine','triangle'];
const NOTES=['C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];
const BASE=[523.25,493.88,466.16,440,415.3,392,369.99,349.23,329.63,311.13,293.66,277.18,261.63];
const DN=['Bombo','Caja','Hi-hat','Hi-hat abierto','Palmas','Tom','Platillo','Cencerro'];
const DRAFT={inst:{},drum:{},ia:{prompt:'',style:'Lo-fi',cre:60,den:40},voz:{}};
let tracks=[],sel=null,act={inst:null,drum:null,ia:null,voz:null},playing=false,step=-1,master=85,limiter=true,hidden={},oct=4,sus=false,uid=0,PRY=[],VW={tx:0,ty:0,z:1},drag=null,Z=5,dnext=0,rc=null;
const KV={};
const T=ty=>act[ty];
const cfgOf=ty=>(act[ty]||{cfg:DRAFT[ty]}).cfg;
const pos=()=>step<0?0:(step%256)/256*100;

  if(t.type=='voz'&&t.rec){const p=t.rec.peaks,n=Math.max(1,Math.round(c[1]*3));for(let j=0;j<n;j++){const v=p[Math.floor(j/n*p.length)]||0;h+=`<i class="wf" style="left:${c[0]+c[1]*j/n}%;height:${4+v*44}px"></i>`}}});

/* Conexiones automáticas. Los extremos pueden colocarse en cualquier lado del perímetro
   y el punto intermedio se puede arrastrar para orientar libremente el cable. */
function layoutPorts(){const p=$('#p-pistas');if(!p)return;const pr=p.getBoundingClientRect();PRY=[];$$('#p-pistas .row').forEach(r=>{const b=r.getBoundingClientRect();PRY[+r.dataset.ti]=(b.top-pr.top+b.height/2)/VW.z})}
function links(){const L=[],sources={};
 if(!hidden.piano&&!hidden.inst)L.push({key:'piano-inst',f:'piano',t:'inst',c:PC.piano});
 tracks.forEach((t,i)=>{const s=SRC[t.type];if(!hidden[s]&&!hidden.pistas&&PRY[i]!=null){const slot=sources[s]||0;sources[s]=slot+1;L.push({key:'track-'+t.id,f:s,t:'pistas',i,slot,c:PC[s]})}});
 L.forEach(l=>{if(l.i!==undefined)l.total=sources[l.f]});
 if(!hidden.pistas&&!hidden.mezcla)L.push({key:'pistas-mezcla',f:'pistas',t:'mezcla',c:PC.pistas});
 if(!hidden.mezcla&&!hidden.master)L.push({key:'mezcla-master',f:'mezcla',t:'master',c:PC.mezcla});return L}
function panelGeometry(id){const o=POS[id],el=$('#p-'+id);return {x:o[0],y:o[1],w:o[2],h:el?el.offsetHeight:(o[3]||300)}}
function defaultPin(l,end){if(end==='from')return {side:'right',u:l.i!==undefined ? clamp(.12+.76*(l.slot+1)/(l.total+1),.08,.92):.21};
 if(l.t==='pistas'&&l.i!==undefined){const g=panelGeometry('pistas');return {side:'left',u:clamp((PRY[l.i]||40)/g.h,.05,.95)}}
 return {side:'left',u:.21}}
function anchor(l,end){const id=end==='from'?l.f:l.t,g=panelGeometry(id),p=PORT_OVERRIDE[l.key+':'+end]||defaultPin(l,end),u=clamp(p.u,.03,.97);
 let px=0,py=0,nx=0,ny=0;
 if(p.side==='left'){py=g.h*u;nx=-1}else if(p.side==='right'){px=g.w;py=g.h*u;nx=1}else if(p.side==='top'){px=g.w*u;ny=-1}else{px=g.w*u;py=g.h;ny=1}
 return {x:g.x+px,y:g.y+py,px,py,nx,ny,side:p.side,u}}
function cableShape(a,b,m){const d1=Math.hypot(m.x-a.x,m.y-a.y),d2=Math.hypot(b.x-m.x,b.y-m.y),dl=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));
 const tx=(b.x-a.x)/dl,ty=(b.y-a.y)/dl;
 const aa=clamp(d1*.38,18,210),bb=clamp(d2*.38,18,210);
 const c1={x:a.x+a.nx*aa,y:a.y+a.ny*aa};const c2={x:m.x-tx*clamp(d1*.22,12,90),y:m.y-ty*clamp(d1*.22,12,90)};
 const c3={x:m.x+tx*clamp(d2*.22,12,90),y:m.y+ty*clamp(d2*.22,12,90)};const c4={x:b.x+b.nx*bb,y:b.y+b.ny*bb};
 return `M${a.x} ${a.y} C${c1.x} ${c1.y} ${c2.x} ${c2.y} ${m.x} ${m.y} C${c3.x} ${c3.y} ${c4.x} ${c4.y} ${b.x} ${b.y}`}
function sync(){layoutPorts();$$('.port').forEach(x=>x.remove());links().forEach(l=>{
 for(const end of ['from','to']){const id=end==='from'?l.f:l.t,e=document.createElement('i');e.className='port';e.dataset.key=l.key;e.dataset.end=end;e.title='Arrastra para cambiar este conector a cualquier lado del módulo';e.setAttribute('role','button');e.setAttribute('aria-label','Mover conector '+(end==='from'?'de salida':'de entrada'));e.style.setProperty('--c',l.c);$('#p-'+id).appendChild(e)}});drawCables()}
function drawCables(){const ls=links(),byKey=new Map(ls.map(l=>[l.key,l]));let s='',h='';
 for(const l of ls){const a=anchor(l,'from'),b=anchor(l,'to'),m=BENDS[l.key]||{x:(a.x+b.x)/2,y:(a.y+b.y)/2},d=cableShape(a,b,m);
 s+=`<path class="cb" d="${d}"/><path class="cc" d="${d}" style="stroke:${l.c}"/><path class="cf" d="${d}"/>`;
 h+=`<i class="cable-bend" data-key="${l.key}" title="Arrastra para curvar este cable en cualquier dirección" style="left:${m.x}px;top:${m.y}px;--c:${l.c}"></i>`}
 $('#cables').innerHTML=s;$('#handles').innerHTML=h;
 $$('.port').forEach(p=>{const l=byKey.get(p.dataset.key);if(!l)return;const a=anchor(l,p.dataset.end);p.style.left=(a.px-13)+'px';p.style.top=(a.py-13)+'px'})}
function worldPoint(clientX,clientY){const r=$('#main').getBoundingClientRect();return {x:(clientX-r.left-VW.tx)/VW.z,y:(clientY-r.top-VW.ty)/VW.z}}
function nearestPin(id,x,y){const g=panelGeometry(id),rx=x-g.x,ry=y-g.y;
 const opts=[{side:'left',d:Math.abs(rx),u:ry/g.h},{side:'right',d:Math.abs(rx-g.w),u:ry/g.h},{side:'top',d:Math.abs(ry),u:rx/g.w},{side:'bottom',d:Math.abs(ry-g.h),u:rx/g.w}];
 opts.sort((a,b)=>a.d-b.d);return {side:opts[0].side,u:clamp(opts[0].u,.03,.97)}}

const kset=(k,ty,v)=>{if(ty)cfgOf(ty)[k]=v;else KV[k]=v};
function knob(k,l,ty,d){let v=kget(k,ty);if(v===undefined){v=d;kset(k,ty,d)}return `<div class="kn"><div class="knob" data-k="${k}" data-ty="${ty||''}" role="slider" tabindex="0" aria-label="${l}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(v)}" style="--r:${-135+v*2.7}deg"></div><small>${l}</small></div>`}

/* sonido */
function note(t,f,d){try{const a=AC(),o=a.createOscillator(),g=a.createGain(),fl=a.createBiquadFilter(),L=sus?1.4:(d||.4);o.type=WV[t.cfg.v];o.frequency.value=f;fl.frequency.value=400+t.cfg.bri*60;g.gain.value=Math.max(.05,t.cfg.vel/100)*t.vol/100*master/100*.25;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+L);o.connect(fl);fl.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+L)}catch(e){}}
function nz(a,d){const b=a.createBuffer(1,Math.ceil(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;return s}
function drum(t,i){try{const a=AC(),n=a.currentTime,c=t.cfg,v=c.vol/100*t.vol/100*master/100,k=Math.pow(2,(c.tun-50)/50),g=a.createGain();g.connect(a.destination);
 if(i==0||i==5){const o=a.createOscillator();o.frequency.setValueAtTime((i?170:150)*k,n);o.frequency.exponentialRampToValueAtTime((i?90:45)*k,n+.15);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+(i?.3:.45));o.connect(g);o.start(n);o.stop(n+.5)}
 else if(i==7){[560*k,845*k].forEach(fr=>{const o=a.createOscillator();o.type='square';o.frequency.value=fr;o.connect(g);o.start(n);o.stop(n+.25)});g.gain.setValueAtTime(v*.3,n);g.gain.exponentialRampToValueAtTime(.001,n+.2)}
 else{const de=[0,.18,.05,.3,.12,0,.9][i],s=nz(a,1),f=a.createBiquadFilter();f.type=i==4?'bandpass':'highpass';f.frequency.value=[0,1200,7000,7000,1500,0,5000][i]*k;s.connect(f);f.connect(g);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+de);s.start(n);s.stop(n+de+.05)}}catch(e){}}

 catch(e){toast('Micrófono no disponible aquí: grabo una toma de demostración')}
 const r=rc;r.iv=setInterval(()=>{let v=0;if(r.an){const d=new Uint8Array(r.an.fftSize);r.an.getByteTimeDomainData(d);for(const x of d)v=Math.max(v,Math.abs(x-128)/128)}else v=.2+.6*Math.abs(Math.sin(performance.now()/300))*Math.random();r.peaks.push(Math.min(1,v*1.6));const m=$('#tvu');if(m)m.style.setProperty('--h',Math.min(100,v*160)+'%');const c=$('#tcnt');if(c)c.textContent=fmt((performance.now()-r.t0)/1000)},100)}

function mezcla(){$('#b-mezcla').innerHTML='<div class="strips">'+tracks.map((t,i)=>`<div class="strip" style="--c:${PC[SRC[t.type]]}"><small>${t.name}</small>${knob('pan'+i,'Pan',null,50)}<div class="fad"><input type="range" min="0" max="100" value="${t.vol}" data-v="${i}" aria-label="Volumen ${t.name}"><div class="meter"><span data-mt="${i}"></span></div></div><span>${t.vol}</span></div>`).join('')+'</div>'+(tracks.length?'':'<p class="empty">Sin pistas.</p>')}
function vuSvg(){let t='';[-50,-37.5,-25,-12.5,0,12.5,25,37.5,50].forEach(a=>t+=`<line x1="100" y1="${a%25?24:20}" x2="100" y2="30" transform="rotate(${a} 100 105)"/>`);return `<div class="vu"><svg viewBox="0 0 200 115" aria-label="Medidor VU"><g stroke="#000" stroke-width="2" fill="none"><path d="M38.7 53.6A80 80 0 0 1 161.3 53.6"/>${t}<path d="M133.8 32.5A80 80 0 0 1 161.3 53.6" stroke="#d0221a" stroke-width="6"/></g><text x="100" y="88" text-anchor="middle" font-size="15" font-weight="700">VU</text><line id="needle" x1="100" y1="105" x2="100" y2="28" stroke="#000" stroke-width="3" style="transform-origin:100px 105px;transform:rotate(-50deg);transition:transform .1s ease-out"/><circle cx="100" cy="105" r="7"/></svg></div>`}
function masterP(){$('#b-master').innerHTML=vuSvg()+`<div class="mrow big"><div class="fad"><input type="range" min="0" max="100" value="${master}" id="mv" aria-label="Volumen master"><div class="meter"><span data-mt="L"></span></div><div class="meter"><span data-mt="R"></span></div></div><div class="stack"><b id="mval" class="lcd" style="font-size:24px">${master}</b><div class="krow">${knob('drive','Saturación',null,30)+knob('tone','Tono',null,50)}</div><button id="lim" aria-pressed="${limiter}">Limitador: ${limiter?'activo':'apagado'}</button><button id="exp">Exportar mezcla</button></div></div>`}

/* reloj único: tempo, cursor, MIDI y batería sincronizados */
function tick(){const s=step%16,b=step>>4;
 tracks.forEach(t=>{if(!audible(t)||hidden[SRC[t.type]]||!inClip(t,b))return;
  if(t.type=='inst'){for(const k in t.roll){const[r,c]=k.split('-');if(+c==s)note(t,BASE[+r],.3)}}
  else if(t.type=='drum')for(let i=0;i<8;i++)if(t.pat[i+'-'+s])drum(t,i)});
 $('#time').textContent=(b+1)+'.'+((s>>2)+1);movHead();meters(1);
 $$('.st.cur').forEach(x=>x.classList.remove('cur'));$$(`.st[data-ds="${s}"]`).forEach(x=>x.classList.add('cur'))}
setInterval(()=>{if(!playing){dnext=0;return}const n=performance.now();if(!dnext||n-dnext>500)dnext=n;while(n>=dnext){step=(step+1)%256;tick();dnext+=60000/(+$('#bpm').value||96)/4}},25);
function meters(on){const b=step>>4;$$('[data-mt]').forEach(m=>{const k=m.dataset.mt;let v=0;if(on){if(k=='L'||k=='R'){v=master*(.45+Math.random()*.5);if(limiter)v=Math.min(v,92)}else{const t=tracks[+k];if(t&&audible(t)&&inClip(t,b))v=t.vol*(.4+Math.random()*.55)}}m.style.setProperty('--h',v+'%');if(k=='L'){const n=$('#needle');if(n)n.style.transform=`rotate(${-50+v*1.05}deg)`}})}

/* lienzo infinito */
function view(){$('#world').style.transform=`translate(${VW.tx}px,${VW.ty}px) scale(${VW.z})`;const m=$('#main').style,s=34*VW.z;m.backgroundSize=s+'px '+s+'px';m.backgroundPosition=VW.tx+'px '+VW.ty+'px'}
const vis=()=>PANELS.map(p=>p[0]).filter(i=>!hidden[i]);
function fit(ids){if(!ids.length)return;const r=$('#main').getBoundingClientRect();let a=1e9,b=1e9,c=-1e9,d=-1e9;ids.forEach(i=>{const o=POS[i],h=$('#p-'+i).offsetHeight;a=Math.min(a,o[0]);b=Math.min(b,o[1]);c=Math.max(c,o[0]+o[2]);d=Math.max(d,o[1]+h)});const z=Math.max(.2,Math.min(1,r.width/(c-a+160),r.height/(d-b+160)));VW.z=z;VW.tx=(r.width-(c-a)*z)/2-a*z;VW.ty=(r.height-(d-b)*z)/2-b*z;view()}
function zoomAt(f,cx,cy){const r=$('#main').getBoundingClientRect(),z=Math.max(.2,Math.min(1.6,VW.z*f));f=z/VW.z;const mx=cx-r.left,my=cy-r.top;VW.tx=mx-(mx-VW.tx)*f;VW.ty=my-(my-VW.ty)*f;VW.z=z;view()}
function vpTop(){$('#main').style.top=$('header').getBoundingClientRect().bottom+'px'}
function chips(){$('#chips').innerHTML=PANELS.map(([id,n])=>`<button class="chip" data-p="${id}" style="--c:${PC[id]}" aria-pressed="${!hidden[id]}"><i></i>${n}</button>`).join('')}
function setHidden(id,b){hidden[id]=b;$('#p-'+id).classList.toggle('hidden',b);chips();if(!b)fit([id]);pistas()}
const GRIPS=['nw','n','ne','e','se','s','sw','w'];
function build(){chips();
  $('#nodes').innerHTML=PANELS.map(([id,n,m])=>{const o=POS[id];return `<section class="panel" id="p-${id}" style="--c:${PC[id]};left:${o[0]}px;top:${o[1]}px;width:${o[2]}px;${o[3]?'height:'+o[3]+'px;':''}"><div class="ph" data-drag="${id}"><h2>${n}</h2><span class="mdl">${m}</span><button data-f="${id}">Enfocar</button><button data-h="${id}" aria-label="Quitar ${n}">✕</button></div><div class="pb" id="b-${id}"></div>${GRIPS.map(side=>`<i class="resize-handle" data-side="${side}" data-id="${id}" title="Redimensionar ${n}: ${side}"></i>`).join('')}</section>`}).join('');
  vpTop();masterP();refresh();fit(['inst','drums','pistas']);sync()}

/* eventos */
document.addEventListener('click',e=>{const b=e.target.closest('button,.th');if(!b)return;const d=b.dataset,id=b.id,t0=T('inst'),td=T('drum');
 if(d.p)setHidden(d.p,!hidden[d.p]);else if(d.h)setHidden(d.h,true);else if(d.f)fit([d.f]);
 else if(d.add)addT(d.add);else if(d.del!==undefined)delT(+d.del);
 else if(d.m!==undefined){tracks[+d.m].mute=!tracks[+d.m].mute;pistas()}
 else if(d.s!==undefined){tracks[+d.s].solo=!tracks[+d.s].solo;pistas()}
 else if(d.t!==undefined)pick(tracks[+d.t]);
 else if(d.r!==undefined&&t0){const k=d.r+'-'+d.c;if(t0.roll[k])delete t0.roll[k];else{t0.roll[k]=1;note(t0,BASE[+d.r])}b.classList.toggle('on');pistas()}
 else if(d.i!==undefined&&t0){t0.cfg.v=+d.i;inst();piano();pistas();note(t0,440)}
 else if(d.vc&&t0){t0.cfg.v=(t0.cfg.v+ +d.vc+INSTS.length)%INSTS.length;inst();piano();pistas()}
 else if(d.oc){oct=Math.max(1,Math.min(7,oct+ +d.oc));piano()}
 else if(id=='sus'){sus=!sus;piano()}
 else if(id=='clr'&&t0){t0.roll={};piano();pistas()}
 else if(d.dp!==undefined&&td)drum(td,+d.dp);
 else if(d.dr!==undefined&&td){const k=d.dr+'-'+d.ds;if(td.pat[k])delete td.pat[k];else{td.pat[k]=1;drum(td,+d.dr)}b.classList.toggle('on');pistas()}
 else if(id=='dclr'&&td){td.pat={};drums();pistas()}
 else if(id=='dpre'&&td){basic(td);drums();pistas()}
 else if(id=='gen'){b.disabled=true;b.textContent='Generando…';setTimeout(()=>{const c=Object.assign({},cfgOf('ia')),t=addT('ia');Object.assign(t.cfg,c);t.name='IA '+c.style+' '+tracks.filter(x=>x.type=='ia').length;t.clips=genClips(c.den);refresh();toast('Pista de IA creada y conectada')},1100)}
 else if(id=='regen'){const t=T('ia');t.clips=genClips(t.cfg.den);pistas();toast('Clips regenerados')}
 else if(id=='rec')recStart();else if(id=='rstop')recStop();
 else if(id=='rplay'){const t=T('voz');if(t&&t.rec&&t.rec.url){$('#p-cinta').classList.add('go');const a=new Audio(t.rec.url);a.onended=()=>$('#p-cinta').classList.remove('go');a.play()}else toast('Esta pista no tiene audio grabado')}
 else if(id=='play'){playing=!playing;b.textContent=playing?'❚❚ Pausa':'▶ Reproducir';$('#cables').classList.toggle('on',playing);if(playing)AC()}
 else if(id=='stop'){playing=false;step=-1;$('#play').textContent='▶ Reproducir';$('#cables').classList.remove('on');$('#time').textContent='1.1';movHead();meters(0);$$('.st.cur').forEach(x=>x.classList.remove('cur'))}
 else if(id=='lim'){limiter=!limiter;masterP()}else if(id=='exp')toast('Mezcla final lista para exportar');
 else if(id=='za')fit(vis());else if(id=='resetLayout')resetLayout();
 else if(id=='zi'||id=='zo'){const r=$('#main').getBoundingClientRect();zoomAt(id=='zi'?1.25:.8,r.left+r.width/2,r.top+r.height/2)}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.v!==undefined){tracks[+t.dataset.v].vol=+t.value;t.parentNode.nextElementSibling.textContent=t.value}
 else if(t.id=='mv'){master=+t.value;$('#mval').textContent=master}
 else if(t.id=='pr')cfgOf('ia').prompt=t.value;
 else if(t.id=='st'){cfgOf('ia').style=t.value;pistas()}});
document.addEventListener('keydown',e=>{const k=e.target.closest&&e.target.closest('.knob');if(!k)return;const v=kget(k.dataset.k,k.dataset.ty);if(e.key=='ArrowUp'||e.key=='ArrowRight'){setK(k,v+5);e.preventDefault()}if(e.key=='ArrowDown'||e.key=='ArrowLeft'){setK(k,v-5);e.preventDefault()}});
document.addEventListener('pointerdown',e=>{
  const port=e.target.closest('.port');if(port){e.preventDefault();e.stopPropagation();drag={kind:'port',key:port.dataset.key,end:port.dataset.end,id:port.closest('.panel').id.slice(2)};port.classList.add('moving');return}
  const bend=e.target.closest('.cable-bend');if(bend){e.preventDefault();e.stopPropagation();drag={kind:'bend',key:bend.dataset.key};return}
  const grip=e.target.closest('.resize-handle');if(grip){e.preventDefault();e.stopPropagation();const id=grip.dataset.id,el=$('#p-'+id),o=POS[id];drag={kind:'resize',id,side:grip.dataset.side,x:e.clientX,y:e.clientY,o:[o[0],o[1],o[2],el.offsetHeight]};el.style.height=el.offsetHeight+'px';el.style.zIndex=++Z;return}
  const kn=e.target.closest('.knob');if(kn){e.preventDefault();const y=e.clientY,v=kget(kn.dataset.k,kn.dataset.ty),mv=ev=>setK(kn,v+(y-ev.clientY)*.8),up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up)};document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);return}
 const ky=e.target.closest('.wk,.bk');if(ky){const t=T('inst');ky.classList.add('dn');if(t)note(t,440*Math.pow(2,(+ky.dataset.n-69)/12),.6);const u=()=>{ky.classList.remove('dn');document.removeEventListener('pointerup',u)};document.addEventListener('pointerup',u);return}
 if(!e.target.closest('#main'))return;const h=e.target.closest('.ph');
 if(h){if(e.target.closest('button'))return;const id=h.dataset.drag;drag={id,x:e.clientX,y:e.clientY,o:POS[id].slice()};$('#p-'+id).style.zIndex=++Z}
 else if(!e.target.closest('.panel'))drag={x:e.clientX,y:e.clientY,tx:VW.tx,ty:VW.ty};else return;
 e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;
  if(drag.kind==='port'){const p=worldPoint(e.clientX,e.clientY);PORT_OVERRIDE[drag.key+':'+drag.end]=nearestPin(drag.id,p.x,p.y);drawCables();return}
  if(drag.kind==='bend'){BENDS[drag.key]=worldPoint(e.clientX,e.clientY);drawCables();return}
  if(drag.kind==='resize'){const p=POS[drag.id],o=drag.o,side=drag.side,dx=(e.clientX-drag.x)/VW.z,dy=(e.clientY-drag.y)/VW.z,el=$('#p-'+drag.id);
    let x=o[0],y=o[1],w=o[2],h=o[3];
    if(side.includes('w')){w=Math.max(240,o[2]-dx);x=o[0]+o[2]-w}else if(side.includes('e'))w=Math.max(240,o[2]+dx);
    if(side.includes('n')){h=Math.max(190,o[3]-dy);y=o[1]+o[3]-h}else if(side.includes('s'))h=Math.max(190,o[3]+dy);
    p[0]=x;p[1]=y;p[2]=w;p[3]=h;el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px';layoutPorts();drawCables();return}
  if(drag.id){const p=POS[drag.id],el=$('#p-'+drag.id);p[0]=drag.o[0]+(e.clientX-drag.x)/VW.z;p[1]=drag.o[1]+(e.clientY-drag.y)/VW.z;el.style.left=p[0]+'px';el.style.top=p[1]+'px';drawCables()}
  else{VW.tx=drag.tx+e.clientX-drag.x;VW.ty=drag.ty+e.clientY-drag.y;view()}});
document.addEventListener('pointerup',()=>{if(drag){if(['port','bend','resize'].includes(drag.kind)||drag.id)saveLayout();drag=null;$$('.port.moving').forEach(p=>p.classList.remove('moving'))}});
document.addEventListener('pointercancel',()=>{if(drag){saveLayout();drag=null}});
$('#main').addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});
window.addEventListener('resize',()=>{vpTop();layoutPorts();drawCables()});
document.addEventListener('scroll',e=>{if(e.target.closest&&e.target.closest('#p-pistas')){layoutPorts();drawCables()}},true);
loadLayout();
build();
</script>
</body>
</html>
